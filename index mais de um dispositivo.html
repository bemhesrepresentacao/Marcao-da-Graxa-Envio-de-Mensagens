<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Disparo & Gestão de Contatos</title>
  <style>
    :root {
      --primary-color: #075e54;
      --secondary-color: #128c7e;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --danger-color: #dc3545;
      --warning-color: #ffc107;
      --info-color: #17a2b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--primary-color);
      color: white;
      padding: 15px 25px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .logo-container { display: flex; align-items: center; gap: 15px; }
    
    .backup-actions { display: flex; gap: 10px; }
    .backup-actions button { background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
    .backup-actions button:hover { background: rgba(255,255,255,0.3); }

    .container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

    .card { background: var(--card-bg); padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .card h2 { margin-bottom: 15px; color: var(--primary-color); border-bottom: 2px solid var(--bg-color); padding-bottom: 5px; }

    form { display: grid; gap: 10px; }
    input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    button { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; background: var(--secondary-color); transition: 0.2s; }
    button:hover { opacity: 0.9; }
    .btn-danger { background: var(--danger-color); }
    .btn-warning { background: var(--warning-color); color: #000; }
    .btn-info { background: var(--info-color); }
    .btn-action { margin-top: 5px; font-size: 0.85rem; padding: 5px 10px; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; font-size: 0.9rem; }
    th { background: #f0f0f0; }

    .media-preview { max-width: 100%; max-height: 150px; margin-top: 10px; border-radius: 5px; display: none; }
    .msg-item { border-left: 4px solid var(--secondary-color); padding: 10px; margin-bottom: 10px; background: #fafafa; border-radius: 0 5px 5px 0; }
    .msg-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: #666; margin-bottom: 5px; }
    .actions { display: flex; gap: 5px; margin-top: 10px; }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <img src="Marcão da Graxa Nome.png" alt="Logo" style="height:45px;" onerror="this.style.display='none'">
      <h1>Sistema de Envio & Gestão</h1>      
    </div>
    <div class="backup-actions">
      <button onclick="exportData()">Exportar Dados (Backup)</button>
      <button onclick="document.getElementById('importFile').click()">Importar Dados</button>
      <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
    </div>
  </header>

  <div class="container">
    
    <!-- COLUNA DA ESQUERDA: CONTATOS & MODELOS -->
    <div>
      <!-- GERENCIADOR DE CONTATOS -->
      <div class="card">
        <h2 id="contactFormTitle">Cadastrar Contato</h2>
        <form id="contactForm">
          <input type="hidden" id="contactId">
          <input type="text" id="contactName" placeholder="Nome Completo" required>
          <input type="text" id="contactAddress" placeholder="Endereço">
          <input type="text" id="contactCity" placeholder="Cidade">
          <input type="text" id="contactPhone" placeholder="Fone/WhatsApp (Ex: 5544999999999)" required>
          <input type="email" id="contactEmail" placeholder="E-mail" required>
          <button type="submit" id="saveContactBtn">Salvar Contato</button>
          <button type="button" id="cancelContactEdit" style="display:none; background:#666;">Cancelar</button>
        </form>

        <h3 style="margin-top: 20px;">Contatos Cadastrados</h3>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>Nome</th>
                <th>Cidade</th>
                <th>Whats</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="contactsTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- MODELOS DE MENSAGEM -->
      <div class="card">
        <h2 id="templateFormTitle">Modelos de Mensagens</h2>
        <form id="templateForm">
          <input type="hidden" id="templateId">
          <input type="text" id="templateTitle" placeholder="Título do Modelo (ex: Boas Vindas)" required>
          <textarea id="templateContent" rows="3" placeholder="Texto padrão da mensagem..." required></textarea>
          <button type="submit" id="saveTemplateBtn">Salvar Modelo</button>
          <button type="button" id="cancelTemplateEdit" style="display:none; background:#666;">Cancelar</button>
        </form>

        <h3 style="margin-top: 15px;">Modelos Salvos</h3>
        <div id="templatesList"></div>
      </div>
    </div>

    <!-- COLUNA DA DIREITA: DISPARO & HISTÓRICO -->
    <div>
      <!-- NOVO ENVIO DE MENSAGEM -->
      <div class="card">
        <h2>Nova Mensagem</h2>
        <form id="messageForm">
          <label>Selecione o Contato:</label>
          <select id="msgContactSelect" required>
            <option value="">-- Selecione um Contato --</option>
          </select>

          <label>Usar um Modelo (Opcional):</label>
          <select id="msgTemplateSelect" onchange="applyTemplate(this.value)">
            <option value="">-- Selecione um Modelo --</option>
          </select>

          <label>Conteúdo da Mensagem:</label>
          <textarea id="msgText" rows="4" placeholder="Digite sua mensagem aqui..." required></textarea>

          <label>Anexar Mídia Local (Imagem/Vídeo):</label>
          <input type="file" id="msgMedia" accept="image/*,video/*" onchange="previewMedia(event)">
          <img id="imagePreview" class="media-preview" alt="Preview Imagem">
          <video id="videoPreview" class="media-preview" controls></video>

          <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button type="button" onclick="sendMessage('whatsapp')" style="background: #25D366; flex: 1;">
              Enviar p/ WhatsApp
            </button>
            <button type="button" onclick="sendMessage('email')" style="background: #0078D4; flex: 1;">
              Enviar p/ E-mail
            </button>
          </div>
        </form>
      </div>

      <!-- HISTÓRICO DE MENSAGENS -->
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <h2 style="margin: 0; border: none; padding: 0;">Histórico de Mensagens</h2>
          <button class="btn-danger btn-action" onclick="clearHistory()" style="padding: 5px 10px;">Limpar Histórico</button>
        </div>
        <div id="messageHistory"></div>
      </div>
    </div>

  </div>

  <script>
    // ESTADO DA APLICAÇÃO (localStorage)
    let contacts = JSON.parse(localStorage.getItem('sys_contacts')) || [];
    let templates = JSON.parse(localStorage.getItem('sys_templates')) || [
      { id: '1', title: 'Aviso de Manutenção', content: 'Olá! Informamos que realizaremos uma manutenção preventiva em nossos sistemas.' },
      { id: '2', title: 'Confirmação de Atendimento', content: 'Olá, tudo bem? Gostaria de confirmar nosso horário agendado.' }
    ];
    let messages = JSON.parse(localStorage.getItem('sys_messages')) || [];
    let currentMediaBase64 = null;

    // INICIALIZAÇÃO
    window.onload = () => {
      renderContacts();
      renderTemplates();
      renderMessages();
    };

    function saveData() {
      localStorage.setItem('sys_contacts', JSON.stringify(contacts));
      localStorage.setItem('sys_templates', JSON.stringify(templates));
      localStorage.setItem('sys_messages', JSON.stringify(messages));
    }

    // --- FUNÇÕES DE EXPORTAÇÃO E IMPORTAÇÃO (PORTABILIDADE) ---
    function exportData() {
      const backupData = {
        version: "1.0",
        exportDate: new Date().toISOString(),
        contacts: contacts,
        templates: templates,
        messages: messages
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      
      const dateStr = new Date().toISOString().slice(0, 10);
      downloadAnchor.setAttribute("download", `backup_sistema_contatos_${dateStr}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          
          if (imported.contacts && Array.isArray(imported.contacts)) {
            contacts = imported.contacts;
          }
          if (imported.templates && Array.isArray(imported.templates)) {
            templates = imported.templates;
          }
          if (imported.messages && Array.isArray(imported.messages)) {
            messages = imported.messages;
          }

          saveData();
          renderContacts();
          renderTemplates();
          renderMessages();
          
          alert("Dados importados com sucesso!");
        } catch (error) {
          alert("Erro ao importar o arquivo. Certifique-se de que é um arquivo JSON válido gerado pelo sistema.");
          console.error(error);
        }
        event.target.value = ''; // Reset file input
      };
      reader.readAsText(file);
    }

    // --- GESTÃO DE CONTATOS ---
    const contactForm = document.getElementById('contactForm');
    contactForm.onsubmit = (e) => {
      e.preventDefault();
      const id = document.getElementById('contactId').value;
      const contactData = {
        id: id || Date.now().toString(),
        name: document.getElementById('contactName').value,
        address: document.getElementById('contactAddress').value,
        city: document.getElementById('contactCity').value,
        phone: document.getElementById('contactPhone').value.replace(/\D/g, ''),
        email: document.getElementById('contactEmail').value
      };

      if (id) {
        const index = contacts.findIndex(c => c.id === id);
        contacts[index] = contactData;
      } else {
        contacts.push(contactData);
      }

      saveData();
      resetContactForm();
      renderContacts();
    };

    function renderContacts() {
      const tbody = document.getElementById('contactsTableBody');
      const select = document.getElementById('msgContactSelect');
      tbody.innerHTML = '';
      select.innerHTML = '<option value="">-- Selecione um Contato --</option>';

      contacts.forEach(c => {
        tbody.innerHTML += `
          <tr>
            <td>${c.name}</td>
            <td>${c.city || '-'}</td>
            <td>${c.phone}</td>
            <td>
              <button class="btn-warning btn-action" onclick="editContact('${c.id}')">Editar</button>
              <button class="btn-danger btn-action" onclick="deleteContact('${c.id}')">Excluir</button>
            </td>
          </tr>
        `;
        select.innerHTML += `<option value="${c.id}">${c.name} (${c.phone})</option>`;
      });
    }

    function editContact(id) {
      const c = contacts.find(item => item.id === id);
      document.getElementById('contactId').value = c.id;
      document.getElementById('contactName').value = c.name;
      document.getElementById('contactAddress').value = c.address;
      document.getElementById('contactCity').value = c.city;
      document.getElementById('contactPhone').value = c.phone;
      document.getElementById('contactEmail').value = c.email;
      
      document.getElementById('contactFormTitle').innerText = 'Editar Contato';
      document.getElementById('cancelContactEdit').style.display = 'inline-block';
    }

    function resetContactForm() {
      contactForm.reset();
      document.getElementById('contactId').value = '';
      document.getElementById('contactFormTitle').innerText = 'Cadastrar Contato';
      document.getElementById('cancelContactEdit').style.display = 'none';
    }
    document.getElementById('cancelContactEdit').onclick = resetContactForm;

    function deleteContact(id) {
      if (confirm('Deseja realmente excluir este contato?')) {
        contacts = contacts.filter(c => c.id !== id);
        saveData();
        renderContacts();
      }
    }

    // --- GESTÃO DE MODELOS ---
    const templateForm = document.getElementById('templateForm');
    templateForm.onsubmit = (e) => {
      e.preventDefault();
      const id = document.getElementById('templateId').value;
      const templateData = {
        id: id || Date.now().toString(),
        title: document.getElementById('templateTitle').value,
        content: document.getElementById('templateContent').value
      };

      if (id) {
        const index = templates.findIndex(t => t.id === id);
        templates[index] = templateData;
      } else {
        templates.push(templateData);
      }

      saveData();
      resetTemplateForm();
      renderTemplates();
    };

    function renderTemplates() {
      const container = document.getElementById('templatesList');
      const select = document.getElementById('msgTemplateSelect');
      container.innerHTML = '';
      select.innerHTML = '<option value="">-- Selecione um Modelo --</option>';

      templates.forEach(t => {
        container.innerHTML += `
          <div class="msg-item">
            <strong>${t.title}</strong>
            <p style="font-size: 0.9rem; margin: 5px 0;">${t.content}</p>
            <button class="btn-warning btn-action" onclick="editTemplate('${t.id}')">Editar</button>
            <button class="btn-danger btn-action" onclick="deleteTemplate('${t.id}')">Excluir</button>
          </div>
        `;
        select.innerHTML += `<option value="${t.id}">${t.title}</option>`;
      });
    }

    function editTemplate(id) {
      const t = templates.find(item => item.id === id);
      document.getElementById('templateId').value = t.id;
      document.getElementById('templateTitle').value = t.title;
      document.getElementById('templateContent').value = t.content;

      document.getElementById('templateFormTitle').innerText = 'Editar Modelo';
      document.getElementById('cancelTemplateEdit').style.display = 'inline-block';
    }

    function resetTemplateForm() {
      templateForm.reset();
      document.getElementById('templateId').value = '';
      document.getElementById('templateFormTitle').innerText = 'Modelos de Mensagens';
      document.getElementById('cancelTemplateEdit').style.display = 'none';
    }
    document.getElementById('cancelTemplateEdit').onclick = resetTemplateForm;

    function deleteTemplate(id) {
      if (confirm('Excluir este modelo?')) {
        templates = templates.filter(t => t.id !== id);
        saveData();
        renderTemplates();
      }
    }

    function applyTemplate(id) {
      const t = templates.find(item => item.id === id);
      if (t) document.getElementById('msgText').value = t.content;
    }

    // --- MÍDIA LOCAL ---
    function previewMedia(event) {
      const file = event.target.files[0];
      const imgPreview = document.getElementById('imagePreview');
      const videoPreview = document.getElementById('videoPreview');

      imgPreview.style.display = 'none';
      videoPreview.style.display = 'none';

      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          currentMediaBase64 = e.target.result;
          if (file.type.startsWith('image/')) {
            imgPreview.src = currentMediaBase64;
            imgPreview.style.display = 'block';
          } else if (file.type.startsWith('video/')) {
            videoPreview.src = currentMediaBase64;
            videoPreview.style.display = 'block';
          }
        };
        reader.readAsDataURL(file);
      } else {
        currentMediaBase64 = null;
      }
    }

    // --- ENVIO & HISTÓRICO DE MENSAGENS ---
    function sendMessage(channel) {
      const contactId = document.getElementById('msgContactSelect').value;
      const text = document.getElementById('msgText').value;

      if (!contactId || !text) {
        alert('Selecione um contato e digite a mensagem!');
        return;
      }

      const contact = contacts.find(c => c.id === contactId);
      
      const newMsg = {
        id: Date.now().toString(),
        contactName: contact.name,
        contactDetail: channel === 'whatsapp' ? contact.phone : contact.email,
        channel: channel,
        text: text,
        media: currentMediaBase64,
        date: new Date().toLocaleString('pt-BR')
      };

      messages.unshift(newMsg);
      saveData();
      renderMessages();

      if (channel === 'whatsapp') {
        if(currentMediaBase64) alert("Atenção: Os navegadores não permitem anexar arquivos automaticamente por links do WhatsApp por motivos de segurança. A imagem/vídeo está salva no histórico; anexe-a manualmente na conversa que se abrirá.");
        const url = `https://api.whatsapp.com/send?phone=${contact.phone}&text=${encodeURIComponent(text)}`;
        window.open(url, '_blank');
      } else if (channel === 'email') {
        const url = `mailto:${contact.email}?subject=Contato&body=${encodeURIComponent(text)}`;
        window.open(url, '_blank');
      }

      document.getElementById('msgText').value = '';
      document.getElementById('msgMedia').value = '';
      document.getElementById('imagePreview').style.display = 'none';
      document.getElementById('videoPreview').style.display = 'none';
      currentMediaBase64 = null;
    }

    function renderMessages() {
      const historyContainer = document.getElementById('messageHistory');
      historyContainer.innerHTML = '';

      if (messages.length === 0) {
        historyContainer.innerHTML = '<p style="color:#777">Nenhuma mensagem salva no histórico.</p>';
        return;
      }

      messages.forEach(m => {
        let mediaHtml = '';
        if (m.media) {
          if (m.media.startsWith('data:image/')) {
            mediaHtml = `<img src="${m.media}" style="max-width:100px; display:block; margin-top:5px; border-radius:4px;">`;
          } else if (m.media.startsWith('data:video/')) {
            mediaHtml = `<video src="${m.media}" style="max-width:150px; display:block; margin-top:5px;" controls></video>`;
          }
        }

        historyContainer.innerHTML += `
          <div class="msg-item">
            <div class="msg-header">
              <span><strong>Para:</strong> ${m.contactName} (${m.channel.toUpperCase()})</span>
              <span>${m.date}</span>
            </div>
            <p id="msg-text-${m.id}">${m.text}</p>
            ${mediaHtml}
            <div class="actions">
              <button class="btn-warning btn-action" onclick="editHistoryMessage('${m.id}')">Editar Texto</button>
              <button class="btn-danger btn-action" onclick="deleteHistoryMessage('${m.id}')">Excluir</button>
            </div>
          </div>
        `;
      });
    }

    function editHistoryMessage(id) {
      const msg = messages.find(m => m.id === id);
      const newText = prompt("Edite o texto da sua mensagem:", msg.text);
      if (newText !== null && newText.trim() !== "") {
        msg.text = newText;
        saveData();
        renderMessages();
      }
    }

    function deleteHistoryMessage(id) {
      if (confirm("Deseja excluir esta mensagem do histórico?")) {
        messages = messages.filter(m => m.id !== id);
        saveData();
        renderMessages();
      }
    }

    function clearHistory() {
      if (confirm("Deseja realmente limpar todo o histórico de mensagens?")) {
        messages = [];
        saveData();
        renderMessages();
      }
    }
  </script>
</body>
</html>
